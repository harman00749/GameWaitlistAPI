<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Waitlist API</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">ENG-96576</p>
        <h1>Game Waitlist CRUD API</h1>
      </div>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Waitlist Entry</h2>
        <form id="waitlist-form" novalidate>
          <input type="hidden" id="entry-id" />

          <div class="field">
            <label for="playerName">Player name</label>
            <input id="playerName" name="playerName" autocomplete="name" aria-describedby="playerName-error" />
            <p class="field-error" id="playerName-error"></p>
          </div>

          <div class="field">
            <label for="gameTitle">Game title</label>
            <input id="gameTitle" name="gameTitle" aria-describedby="gameTitle-error" />
            <p class="field-error" id="gameTitle-error"></p>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="partySize">Party size</label>
              <input id="partySize" name="partySize" type="number" min="1" max="12" aria-describedby="partySize-error" />
              <p class="field-error" id="partySize-error"></p>
            </div>

            <div class="field">
              <label for="status">Status</label>
              <select id="status" name="status" aria-label="Waitlist status">
                <option value="waiting">Waiting</option>
                <option value="seated">Seated</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" inputmode="tel" aria-describedby="phone-error" />
            <p class="field-error" id="phone-error"></p>
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3" aria-label="Entry notes"></textarea>
          </div>

          <div class="actions">
            <button type="submit" id="submit-button" aria-label="Save waitlist entry">Add entry</button>
            <button type="button" class="secondary-button" id="reset-button" aria-label="Clear waitlist form">Clear</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-heading">
        <div class="list-header">
          <div>
            <h2 id="list-heading">Current Waitlist</h2>
            <p id="result-count">Loading entries...</p>
          </div>
          <div class="search-row">
            <label class="sr-only" for="search">Search waitlist</label>
            <input id="search" placeholder="Search name or game" aria-label="Search by player or game" />
            <button type="button" id="refresh-button" aria-label="Refresh waitlist">Refresh</button>
          </div>
        </div>

        <div id="loading" class="loading" role="status" aria-live="polite" hidden>
          Loading waitlist data...
        </div>
        <div id="empty-state" class="empty-state" hidden>No data found.</div>
        <div id="message" class="message" role="status" aria-live="polite"></div>
        <div id="entries" class="entries" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
